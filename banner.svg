<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="nm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".6" stop-color="#7c8cff"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
<radialGradient id="g1" cx="85%" cy="15%" r="60%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="5%" cy="100%" r="55%"><stop offset="0" stop-color="#a855f7" stop-opacity=".25"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="hud"><rect x="610" y="60" width="300" height="240"/></clipPath>
</defs>
<rect width="960" height="380" fill="#040a12"/>
<rect width="960" height="380" fill="url(#g1)"/><rect width="960" height="380" fill="url(#g2)"/>

<!-- perspective floor -->
<g stroke="#22d3ee" stroke-opacity=".22" fill="none">
<path d="M0 270H960M0 292H960M0 318H960M0 350H960"/>
<path d="M480 240L-200 380M480 240L40 380M480 240L260 380M480 240L480 380M480 240L700 380M480 240L920 380M480 240L1160 380"/>
</g>
<rect y="240" width="960" height="140" fill="#040a12" fill-opacity=".35"/>
<rect x="1" y="1" width="958" height="378" fill="none" stroke="#16384a"/>

<!-- floating particles -->
<g fill="#22d3ee">
<circle cx="120" cy="330" r="1.6"><animate attributeName="cy" values="340;40" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="9s" repeatCount="indefinite"/></circle>
<circle cx="330" cy="350" r="1.4"><animate attributeName="cy" values="360;60" dur="12s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="12s" begin="2s" repeatCount="indefinite"/></circle>
<circle cx="560" cy="345" r="1.8" fill="#c084fc"><animate attributeName="cy" values="350;30" dur="10s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="10s" begin="1s" repeatCount="indefinite"/></circle>
<circle cx="940" cy="330" r="1.5"><animate attributeName="cy" values="340;50" dur="11s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="11s" begin="4s" repeatCount="indefinite"/></circle>
</g>

<!-- left text -->
<g>
<circle cx="44" cy="56" r="4" fill="#34f5a6"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
<text x="58" y="60" fill="#34f5a6" font-size="13" letter-spacing="2" font-family="'JetBrains Mono','Courier New',monospace">OPEN TO OPPORTUNITIES</text>
<text x="40" y="136" fill="#eaf8ff" font-size="68" font-weight="800" letter-spacing="1">MAHESH</text>
<text x="40" y="204" fill="url(#nm)" font-size="68" font-weight="800" letter-spacing="1" filter="url(#glow)">CHANDRA</text>
<rect x="42" y="218" width="260" height="3" fill="url(#bar)"><animate attributeName="width" values="40;300;40" dur="5s" repeatCount="indefinite"/></rect>
<g fill="#22d3ee" font-size="20" font-family="'JetBrains Mono','Courier New',monospace">
<text x="40" y="252">&gt; YOLOv8 / YOLO11 detection<animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;.2;.25;.5;.7;.75;.9;.95;1" dur="12s" repeatCount="indefinite"/></text>
<text x="40" y="252" opacity="0">&gt; ANPR and OCR pipelines<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.22;.27;.47;.52;1" dur="12s" repeatCount="indefinite"/></text>
<text x="40" y="252" opacity="0">&gt; Edge AI on NVIDIA Jetson<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.47;.52;.72;.77;1" dur="12s" repeatCount="indefinite"/></text>
<text x="40" y="252" opacity="0">&gt; Real-time video analytics<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.72;.77;.97;1" dur="12s" repeatCount="indefinite"/></text>
</g>
<text x="40" y="284" fill="#7fa0b4" font-size="14">AI &amp; Computer Vision Engineer · from pixels to production</text>
<g font-size="12" font-family="'JetBrains Mono','Courier New',monospace" text-anchor="middle">
<g fill="none" stroke="#22d3ee" stroke-opacity=".6"><rect x="40" y="304" width="78" height="26" rx="13"/><rect x="128" y="304" width="96" height="26" rx="13"/><rect x="234" y="304" width="92" height="26" rx="13"/><rect x="336" y="304" width="96" height="26" rx="13" stroke="#c084fc"/></g>
<g fill="#dff4ff"><text x="79" y="321">YOLO11</text><text x="176" y="321">ANPR·OCR</text><text x="280" y="321">JETSON</text><text x="384" y="321">OpenCV</text></g>
</g>
</g>

<!-- right HUD -->
<g>
<g transform="translate(760,180)" fill="none" stroke="#22d3ee" stroke-opacity=".35">
<circle r="150" stroke-dasharray="3 9"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/></circle>
<circle r="118" stroke="#c084fc" stroke-opacity=".35" stroke-dasharray="40 14"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite"/></circle>
</g>
<rect x="610" y="60" width="300" height="240" fill="#0b1822" fill-opacity=".75" stroke="#16384a"/>
<g clip-path="url(#hud)">
<rect x="610" y="236" width="300" height="64" fill="#0e2230"/>
<!-- car -->
<rect x="666" y="170" width="188" height="64" rx="16" fill="#16384a"/>
<path d="M692 170L710 140H810L828 170Z" fill="#16384a"/>
<path d="M716 168L728 146H792L804 168Z" fill="#0b1822"/>
<circle cx="700" cy="236" r="16" fill="#0b1822" stroke="#22d3ee" stroke-opacity=".5"/><circle cx="820" cy="236" r="16" fill="#0b1822" stroke="#22d3ee" stroke-opacity=".5"/>
<rect x="714" y="196" width="92" height="22" rx="3" fill="#f4f1e4"/>
<text x="760" y="212" font-size="11" font-weight="700" fill="#111" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace">DL3CAB1234</text>
<!-- detections -->
<rect x="656" y="132" width="208" height="112" fill="none" stroke="#22d3ee" stroke-width="2"/>
<rect x="656" y="114" width="84" height="18" fill="#22d3ee"/><text x="662" y="127" font-size="11" fill="#040a12" font-family="'JetBrains Mono','Courier New',monospace">car 0.94</text>
<g filter="url(#glow)"><rect x="708" y="190" width="104" height="34" fill="none" stroke="#ffb020" stroke-width="2"><animate attributeName="stroke-opacity" values="1;.35;1" dur="1.4s" repeatCount="indefinite"/></rect></g>
<rect x="708" y="172" width="80" height="18" fill="#ffb020"/><text x="713" y="185" font-size="11" fill="#040a12" font-family="'JetBrains Mono','Courier New',monospace">plate 0.89</text>
<!-- scan beam -->
<rect x="610" y="60" width="300" height="40" fill="url(#bar)" fill-opacity=".35"><animate attributeName="y" values="40;270;40" dur="4s" repeatCount="indefinite"/></rect>
</g>
<g fill="none" stroke="#22d3ee" stroke-width="3"><path d="M610 82V60H632"/><path d="M910 278V300H888"/></g>
<circle cx="628" cy="78" r="4" fill="#ff5c7a"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
<text x="640" y="82" font-size="11" fill="#7fa0b4" font-family="'JetBrains Mono','Courier New',monospace">RTSP · LIVE</text>
</g>
</svg>
