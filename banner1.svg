<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="'JetBrains Mono','Courier New',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<pattern id="g" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#22d3ee" stroke-opacity=".07"/></pattern>
<radialGradient id="glow" cx="75%" cy="10%" r="60%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".18"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
</defs>
<rect width="960" height="340" fill="#050c13"/>
<rect width="960" height="340" fill="url(#g)"/>
<rect width="960" height="340" fill="url(#glow)"/>
<rect x="1" y="1" width="958" height="338" fill="none" stroke="#16384a"/>
<!-- corner brackets -->
<g fill="none" stroke="#22d3ee" stroke-width="3"><path d="M1 28V1H28"/><path d="M959 312V339H932"/></g>

<!-- road -->
<rect x="0" y="262" width="960" height="78" fill="#0b1822"/>
<line x1="0" y1="300" x2="960" y2="300" stroke="#16384a" stroke-dasharray="22 16"/>

<!-- alert zone -->
<rect x="610" y="120" width="250" height="150" fill="#ffb020" fill-opacity=".08" stroke="#ffb020" stroke-width="2" stroke-dasharray="8 6"/>
<text x="616" y="112" fill="#ffb020" font-size="12">ZONE Z1</text>

<!-- moving detections -->
<g>
<animateTransform attributeName="transform" type="translate" from="-200 0" to="1100 0" dur="9s" repeatCount="indefinite"/>
<rect x="0" y="272" width="110" height="46" rx="10" fill="#16384a"/>
<rect x="28" y="278" width="54" height="13" fill="#0b1822"/>
<rect x="-6" y="266" width="122" height="58" fill="none" stroke="#22d3ee" stroke-width="2"/>
<rect x="-6" y="250" width="92" height="16" fill="#22d3ee"/>
<text x="-2" y="262" fill="#050c13" font-size="11">car #14 0.94</text>
</g>
<g>
<animateTransform attributeName="transform" type="translate" from="1100 0" to="-200 0" dur="12s" repeatCount="indefinite"/>
<circle cx="0" cy="168" r="9" fill="#16384a"/><rect x="-9" y="180" width="18" height="38" fill="#16384a"/>
<rect x="-15" y="152" width="30" height="74" fill="none" stroke="#ff5c7a" stroke-width="2"/>
<rect x="-15" y="136" width="96" height="16" fill="#ff5c7a"/>
<text x="-11" y="148" fill="#050c13" font-size="11">person #7 0.88</text>
</g>
<g>
<animateTransform attributeName="transform" type="translate" from="-200 0" to="1100 0" dur="15s" begin="3s" repeatCount="indefinite"/>
<circle cx="0" cy="200" r="9" fill="#16384a"/><rect x="-9" y="212" width="18" height="38" fill="#16384a"/>
<rect x="-15" y="184" width="30" height="74" fill="none" stroke="#22d3ee" stroke-width="2"/>
<rect x="-15" y="168" width="96" height="16" fill="#22d3ee"/>
<text x="-11" y="180" fill="#050c13" font-size="11">person #9 0.91</text>
</g>

<!-- scan line -->
<rect width="960" height="2" fill="#22d3ee" fill-opacity=".18"><animate attributeName="y" from="0" to="340" dur="4s" repeatCount="indefinite"/></rect>

<!-- text -->
<text x="36" y="48" fill="#34f5a6" font-size="13">&gt; init vision_core ... camera online ... ready</text>
<text x="36" y="104" fill="#dff4ff" font-size="40" font-weight="700" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">MAHESH CHANDRA</text>
<text x="36" y="140" fill="#7fa0b4" font-size="15">I build vision systems that survive real cameras.</text>

<g fill="#22d3ee" font-size="19">
<text x="36" y="188">YOLOv8 / YOLO11 detection<animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;.2;.25;.5;.7;.75;.9;.95;1" dur="12s" repeatCount="indefinite"/></text>
<text x="36" y="188" opacity="0">ANPR and OCR<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.22;.27;.47;.52;1" dur="12s" repeatCount="indefinite"/></text>
<text x="36" y="188" opacity="0">Edge AI on NVIDIA Jetson<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.47;.52;.72;.77;1" dur="12s" repeatCount="indefinite"/></text>
<text x="36" y="188" opacity="0">Real-time video analytics<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.72;.77;.97;1" dur="12s" repeatCount="indefinite"/></text>
</g>
<rect x="36" y="206" width="10" height="3" fill="#22d3ee"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
</svg>
